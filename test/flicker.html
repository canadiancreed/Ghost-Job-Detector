<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GJ Flicker Test</title>
<style>body{font:14px system-ui;margin:16px;background:#fff;color:#111} pre{white-space:pre-wrap}</style>
</head>
<body>
<h1>Ghost Job Detector — one score per listing</h1>
<p>Runs the real content script against a fake two-pane job site whose pane fills in stages, and records every score that appears on screen.</p>
<div id="pane"><h2 id="anchor">pane</h2></div>
<pre id="out">running… (about 20 seconds)</pre>
<script>
  // WebExtension API stub with in-memory storage; records toolbar messages.
  (function () {
    const mem = {};
    globalThis.toolbar = [];
    globalThis.browser = {
      storage: {
        local: {
          async get(keys) {
            if (keys === null) return JSON.parse(JSON.stringify(mem));
            const o = {};
            for (const k of [].concat(keys)) if (k in mem) o[k] = JSON.parse(JSON.stringify(mem[k]));
            return o;
          },
          async set(obj) { Object.assign(mem, JSON.parse(JSON.stringify(obj))); },
          async remove(keys) { for (const k of [].concat(keys)) delete mem[k]; },
        },
        onChanged: { addListener() {} },
      },
      runtime: { sendMessage: async (m) => { toolbar.push(m.type === "GJ_SCORE" ? m.score : null); }, onMessage: { addListener() {} }, getManifest: () => ({ version: "test" }) },
    };
  })();

  // Fake site: `site` is what the page currently shows; `site.id` is what the URL says.
  globalThis.site = { id: null, show: null };
  globalThis.GJExtractors = {
    fake: {
      name: "Fake",
      matches: () => true,
      currentJobId: () => site.id,
      findCards: () => [],
      extractDetail() {
        const s = site.show;
        if (!s) return null;
        return { listing: Object.assign({ platform: "fake", location: "Toronto, ON" }, s), anchor: { el: document.getElementById("anchor"), where: "afterend" } };
      },
    },
  };
</script>
<script>
async function load(src) {
  await new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = `../src/${src}?t=${Date.now()}`;
    s.onload = res;
    s.onerror = () => rej(new Error("failed to load " + src));
    document.head.appendChild(s);
  });
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const touch = () => document.getElementById("pane").appendChild(document.createElement("i")); // a DOM change, like a site re-render

(async function () {
  for (const f of ["scoring.js", "storage.js", "extractors/common.js", "ui.js"]) await load(f);
  const out = [];
  const check = (name, cond, extra) => out.push(`${cond ? "PASS" : "FAIL"}  ${name}${extra !== undefined ? "  → " + JSON.stringify(extra) : ""}`);

  // Record every (listing shown in URL, score on screen) change.
  const seen = [];
  let last = "";
  setInterval(() => {
    const hosts = [...document.querySelectorAll("[data-gj]")];
    const scores = hosts.map((h) => h.shadowRoot && h.shadowRoot.querySelector(".score")).filter(Boolean).map((e) => e.textContent);
    const k = `${site.id}|${scores.join(",")}`;
    if (k !== last) { last = k; seen.push({ id: site.id, scores }); }
  }, 20);

  const longDesc = "We are hiring an analyst to own monthly reporting for our finance team. ".repeat(20);
  const A = { id: "A", title: "Financial Analyst", company: "Maple Co", ageDays: 2 };

  site.id = "A";
  site.show = Object.assign({}, A);
  await load("content.js");

  // Pane fills in stages: description at 0.7s, salary at 1.4s.
  await wait(700); site.show = Object.assign({}, A, { description: longDesc }); touch();
  await wait(700); site.show = Object.assign({}, A, { description: longDesc, salaryListed: true, salaryText: "$70,000" }); touch();
  await wait(3000);

  const aScores = seen.filter((x) => x.id === "A" && x.scores.length).map((x) => x.scores.join(","));
  const expectA = GJScoring.score(Object.assign({ platform: "fake", location: "Toronto, ON" }, A, { description: longDesc, salaryListed: true, salaryText: "$70,000" }), {}).score;
  check("A: exactly one score ever shown", new Set(aScores).size === 1, aScores);
  check("A: the score shown is the fully-loaded one", aScores[0] === String(expectA), { shown: aScores[0], expected: expectA });

  // Later page changes don't change a score already shown.
  site.show = Object.assign({}, site.show, { ageDays: 45 }); touch();
  await wait(2500);
  const aAfter = seen.filter((x) => x.id === "A" && x.scores.length).map((x) => x.scores.join(","));
  check("A: score stays put after later page changes", new Set(aAfter).size === 1, aAfter);

  // Click listing B: URL changes first, pane still shows A for 1s (stale), then B fills in.
  const B = { id: "B", title: "Payroll Clerk", company: "Birch Ltd", ageDays: 70, salaryListed: false };
  const mark = seen.length;
  site.id = "B"; // pane still shows A's content (with A's id)
  touch();
  await wait(500);
  site.show = Object.assign({}, A, { id: "B", description: longDesc, salaryListed: true, salaryText: "$70,000" }); // stale content under the new id
  touch();
  await wait(1000);
  site.show = Object.assign({}, B); touch();
  await wait(600);
  site.show = Object.assign({}, B, { description: "Process payroll. ".repeat(10) }); touch();
  await wait(4000);

  const after = seen.slice(mark);
  const bScores = after.filter((x) => x.id === "B" && x.scores.length).map((x) => x.scores.join(","));
  const expectB = GJScoring.score(Object.assign({ platform: "fake", location: "Toronto, ON" }, B, { description: "Process payroll. ".repeat(10) }), {}).score;
  check("B: A's score removed as soon as B is opened", after.length > 0 && after[0].scores.length === 0, after.slice(0, 2));
  check("B: exactly one score ever shown", new Set(bScores).size === 1, bScores);
  check("B: score is B's own, not A's leftover content", bScores[0] === String(expectB), { shown: bScores[0], expected: expectB, a: expectA });

  // Toolbar badge: never shows an intermediate number.
  const tb = toolbar.filter((x) => x !== null);
  check("toolbar only ever showed the two final scores", JSON.stringify(tb) === JSON.stringify([expectA, expectB]), toolbar);

  // Extension reloaded/updated while the tab is open: a leftover card from the old copy
  // is on the page and a second copy of the script starts. Never more than one card.
  const leftover = document.createElement("gj-card");
  leftover.setAttribute("data-gj", "1");
  document.body.appendChild(leftover);
  let maxCards = 0;
  const counter = setInterval(() => { maxCards = Math.max(maxCards, document.querySelectorAll("gj-card[data-gj]").length); }, 10);
  delete globalThis.__gjLoaded;
  await load("content.js");
  await wait(3500);
  clearInterval(counter);
  const finalCards = [...document.querySelectorAll("gj-card[data-gj]")];
  check("second copy: leftover card removed, never two cards", maxCards <= 1 && !leftover.isConnected, { maxCards, leftoverStillThere: leftover.isConnected });
  check("second copy: exactly one card at the end, with B's score", finalCards.length === 1 && finalCards[0].shadowRoot.querySelector(".score").textContent === String(expectB), finalCards.map((h) => h.shadowRoot && h.shadowRoot.querySelector(".score") && h.shadowRoot.querySelector(".score").textContent));
  touch();
  await wait(1500);
  check("second copy: still one card after more page changes", document.querySelectorAll("gj-card[data-gj]").length === 1);

  // React/Next.js sites can rebuild the page after load, wiping the
  // extension's mark on <html> and its card. The extension must carry on and redraw.
  document.documentElement.removeAttribute("data-gj-instance");
  document.querySelectorAll("gj-card[data-gj]").forEach((n) => n.remove());
  touch();
  await wait(2000);
  const rebuilt = [...document.querySelectorAll("gj-card[data-gj]")];
  check("page rebuilt by the site: card comes back, same score", rebuilt.length === 1 && rebuilt[0].shadowRoot.querySelector(".score").textContent === String(expectB), rebuilt.length);

  const fails = out.filter((l) => l.startsWith("FAIL")).length;
  out.unshift(`${out.length - fails} passed, ${fails} failed`);
  document.getElementById("out").textContent = out.join("\n");
  document.title = fails ? "FAIL" : "PASS";
})().catch((e) => { document.getElementById("out").textContent = "ERROR " + e.stack; });
</script>
</body>
</html>
